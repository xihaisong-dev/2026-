name: Repository checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository structure and JSON
        run: python -X utf8 协作/工具/check_repository.py
      - name: Verify workflow startup and blocking behavior
        run: python -X utf8 协作/工具/verify_migration.py
